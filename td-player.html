<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Truth Desk · Video player</title>
  <meta name="robots" content="noindex" />
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
    }
    header a { color: #38bdf8; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card {
      margin: 0 0 18px;
      padding: 12px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .card.focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 1px #f59e0b;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      line-height: 1.35;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fecaca;
      color: #7f1d1d;
      margin-right: 8px;
    }
    video {
      width: 100%;
      max-height: 420px;
      border-radius: 10px;
      background: #000;
      display: block;
    }
    .yt-shell {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .yt-facade {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      border: 0;
      padding: 0;
      background: #000;
    }
    .yt-facade img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .yt-facade .shade {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(transparent 30%, rgba(0, 0, 0, 0.65));
    }
    .yt-facade .btn-play {
      width: 72px;
      height: 50px;
      border-radius: 14px;
      background: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .yt-facade .btn-play::before {
      content: "";
      display: block;
      margin-left: 4px;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff;
    }
    .yt-facade .label {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    .yt-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      min-height: 220px;
    }
    .yt-frame iframe,
    .yt-frame > div {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }
    .yt-error {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .actions a,
    .actions button {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 999px;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-yt {
      background: #dc2626;
      color: #fff !important;
    }
    .btn-inline {
      background: #334155;
      color: #e2e8f0 !important;
    }
    .btn-blaze {
      background: #1e293b;
      color: #38bdf8 !important;
      border: 1px solid #334155;
    }
    .meta {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0 0 10px;
    }
  </style>
</head>
<body>
  <header>
    <strong>Truth Desk · smart video player</strong>
    · <a href="https://wethepeoplepress.com/category/truth-desk/">Back to desk</a>
    <p style="margin:6px 0 0;font-size:0.85rem;color:#94a3b8;">
      Only one clip plays at a time. Use <strong>Play here</strong> for in-page video.
      Scroll away to auto-pause. Red poster opens YouTube if needed.
    </p>
  </header>
  <main id="rail">
    <p id="status">Loading clips…</p>
  </main>
  <script>
    (function () {
      var status = document.getElementById("status");
      var rail = document.getElementById("rail");
      var focus = (
        new URLSearchParams(location.search).get("v") ||
        location.hash.replace(/^#/, "") ||
        ""
      ).trim();
      var activeVideo = null;
      var scrollIo = null;
      // shell element → YT.Player instance
      var ytPlayers = typeof WeakMap !== "undefined" ? new WeakMap() : null;
      var ytApiReady = false;
      var ytApiCallbacks = [];

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function cleanId(id) {
        return String(id || "").replace(/[^A-Za-z0-9_-]/g, "");
      }

      function ytId(item) {
        var direct = cleanId(item.youtube_id);
        if (direct) return direct;
        var u = String(item.youtube || item.url || "");
        var m =
          u.match(/[?&]v=([A-Za-z0-9_-]{6,})/) ||
          u.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/) ||
          u.match(/embed\/([A-Za-z0-9_-]{6,})/) ||
          u.match(/shorts\/([A-Za-z0-9_-]{6,})/);
        return m ? cleanId(m[1]) : "";
      }

      function watchUrl(yid) {
        return "https://www.youtube.com/watch?v=" + encodeURIComponent(yid);
      }

      function posterUrl(item, yid) {
        return "https://i.ytimg.com/vi/" + encodeURIComponent(yid) + "/hqdefault.jpg";
      }

      function loadYouTubeApi(cb) {
        if (window.YT && window.YT.Player) {
          ytApiReady = true;
          cb();
          return;
        }
        ytApiCallbacks.push(cb);
        if (document.getElementById("yt-iframe-api")) return;
        var prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function () {
          ytApiReady = true;
          if (typeof prev === "function") {
            try {
              prev();
            } catch (e) {}
          }
          var q = ytApiCallbacks.slice();
          ytApiCallbacks = [];
          q.forEach(function (fn) {
            try {
              fn();
            } catch (e) {
              console.error(e);
            }
          });
        };
        var s = document.createElement("script");
        s.id = "yt-iframe-api";
        s.src = "https://www.youtube.com/iframe_api";
        s.async = true;
        document.head.appendChild(s);
      }

      function pauseHtml5(except) {
        rail.querySelectorAll("video").forEach(function (v) {
          if (except && v === except) return;
          try {
            if (!v.paused) v.pause();
          } catch (e) {}
        });
        activeVideo = except || null;
      }

      function destroyYtPlayer(shell) {
        if (!shell || !ytPlayers) return;
        var player = ytPlayers.get(shell);
        if (!player) return;
        try {
          if (player.stopVideo) player.stopVideo();
        } catch (e) {}
        try {
          if (player.destroy) player.destroy();
        } catch (e) {}
        ytPlayers.delete(shell);
      }

      function facadeHtml(yid, title) {
        return (
          '<a class="yt-facade" href="' +
          esc(watchUrl(yid)) +
          '" target="_blank" rel="noopener noreferrer" aria-label="Watch on YouTube: ' +
          esc(title || yid) +
          '">' +
          '<img src="' +
          esc(posterUrl(null, yid)) +
          '" alt="" width="640" height="360" loading="lazy" />' +
          '<div class="shade"><span class="btn-play" aria-hidden="true"></span>' +
          '<span class="label">Watch on YouTube</span></div></a>'
        );
      }

      function showPlayError(shell, yid, msg) {
        var title = shell.getAttribute("data-title") || yid;
        shell.innerHTML =
          '<div class="yt-frame"><div class="yt-error">' +
          "<div>" +
          esc(msg || "Could not start in-page playback.") +
          "</div>" +
          '<a class="btn-yt" href="' +
          esc(watchUrl(yid)) +
          '" target="_blank" rel="noopener">Open on YouTube →</a>' +
          '<button type="button" class="btn-inline" data-retry="1">Try Play here again</button>' +
          "</div></div>";
        var retry = shell.querySelector("[data-retry]");
        if (retry) {
          retry.addEventListener("click", function (e) {
            e.preventDefault();
            mountInline(shell, yid, true);
          });
        }
      }

      /** Tear down an inline YouTube player back to the poster facade (stops audio). */
      function demountShell(shell, force) {
        if (!shell || !shell.classList.contains("yt-shell")) return;
        var hasPlayer =
          shell.querySelector("iframe") ||
          shell.querySelector(".yt-frame") ||
          (ytPlayers && ytPlayers.get(shell));
        if (!hasPlayer) return;
        if (!force) {
          var protectUntil = parseInt(
            shell.getAttribute("data-protect-until") || "0",
            10
          );
          if (protectUntil && Date.now() < protectUntil) return;
        }
        destroyYtPlayer(shell);
        var yid = shell.getAttribute("data-yid") || "";
        var title = shell.getAttribute("data-title") || yid;
        shell.removeAttribute("data-playing");
        shell.removeAttribute("data-protect-until");
        shell.style.minHeight = "";
        shell.innerHTML = facadeHtml(yid, title);
      }

      function demountAllYouTube(exceptShell) {
        rail.querySelectorAll(".yt-shell").forEach(function (shell) {
          if (exceptShell && shell === exceptShell) return;
          demountShell(shell, true);
        });
      }

      function observeForScrollPause(el) {
        if (!el || !scrollIo) return;
        try {
          scrollIo.observe(el);
        } catch (e) {}
      }

      function ensureScrollIo() {
        if (scrollIo || !("IntersectionObserver" in window)) return;
        scrollIo = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (en) {
              var el = en.target;
              if (en.intersectionRatio >= 0.25) {
                el.setAttribute("data-was-visible", "1");
                return;
              }
              if (el.getAttribute("data-was-visible") !== "1") return;
              if (el.tagName === "VIDEO") {
                try {
                  if (!el.paused) el.pause();
                } catch (e) {}
                if (activeVideo === el) activeVideo = null;
                return;
              }
              if (el.classList && el.classList.contains("yt-shell")) {
                // Pause first; full demount only if still mostly off-screen
                var player = ytPlayers && ytPlayers.get(el);
                if (player && player.pauseVideo) {
                  try {
                    player.pauseVideo();
                  } catch (e) {}
                }
                if (en.intersectionRatio < 0.05) {
                  demountShell(el, false);
                }
              }
            });
          },
          { threshold: [0, 0.05, 0.1, 0.25, 0.5, 1], rootMargin: "0px" }
        );
      }

      /**
       * Play YouTube in-page via official IFrame API (reliable after a click).
       * Plain iframes often show a black frame (Error 153 / referrer issues).
       */
      function mountInline(shell, yid, autoplay) {
        if (!shell || !yid) {
          console.warn("Play here: missing shell or video id", shell, yid);
          return;
        }
        yid = cleanId(yid);
        if (!yid) return;

        pauseHtml5(null);
        demountAllYouTube(shell);

        shell.setAttribute("data-protect-until", String(Date.now() + 4000));
        shell.setAttribute("data-playing", "1");
        shell.setAttribute("data-was-visible", "1");
        shell.style.minHeight = "240px";

        var title = shell.getAttribute("data-title") || yid;
        shell.innerHTML = "";

        var frame = document.createElement("div");
        frame.className = "yt-frame";
        var host = document.createElement("div");
        host.id = "ytp-" + yid + "-" + String(Date.now());
        host.style.width = "100%";
        host.style.height = "100%";
        frame.appendChild(host);
        shell.appendChild(frame);

        var note = document.createElement("p");
        note.className = "meta";
        note.style.margin = "8px 0 0";
        note.innerHTML =
          'Playing here · scroll away to pause · <a class="btn-yt" style="padding:4px 10px" href="' +
          esc(watchUrl(yid)) +
          '" target="_blank" rel="noopener">Open on YouTube</a>';
        shell.appendChild(note);

        loadYouTubeApi(function () {
          if (!window.YT || !window.YT.Player) {
            showPlayError(shell, yid, "YouTube player API failed to load.");
            return;
          }
          try {
            var player = new window.YT.Player(host.id, {
              videoId: yid,
              width: "100%",
              height: "100%",
              playerVars: {
                autoplay: autoplay ? 1 : 0,
                rel: 0,
                modestbranding: 1,
                playsinline: 1,
                fs: 1,
                // Do not set origin unless needed — wrong origin blanks the player
              },
              events: {
                onReady: function (ev) {
                  try {
                    if (autoplay && ev && ev.target && ev.target.playVideo) {
                      ev.target.playVideo();
                    }
                  } catch (e) {
                    console.warn("playVideo", e);
                  }
                  shell.style.minHeight = "";
                  observeForScrollPause(shell);
                },
                onError: function (ev) {
                  var code = ev && ev.data;
                  var msg =
                    "YouTube error " +
                    code +
                    ". This clip may block embeds — open on YouTube.";
                  showPlayError(shell, yid, msg);
                },
                onStateChange: function (ev) {
                  // 1 = playing
                  if (ev && ev.data === 1) {
                    pauseHtml5(null);
                    // stop other YT players
                    if (ytPlayers) {
                      rail.querySelectorAll(".yt-shell").forEach(function (other) {
                        if (other === shell) return;
                        var op = ytPlayers.get(other);
                        if (op && op.pauseVideo) {
                          try {
                            op.pauseVideo();
                          } catch (e) {}
                        }
                      });
                    }
                  }
                },
              },
            });
            if (ytPlayers) ytPlayers.set(shell, player);
          } catch (err) {
            console.error("YT.Player failed", err);
            showPlayError(
              shell,
              yid,
              "Could not create in-page player. Open on YouTube instead."
            );
          }
        });
      }

      function youtubeCard(item, yid, title, host) {
        var root = document.createElement("article");
        root.className = "card";
        root.id = "v-" + yid;
        root.setAttribute("data-youtube-id", yid);

        var h2 = document.createElement("h2");
        h2.innerHTML = '<span class="badge">YOUTUBE</span>' + esc(title);
        root.appendChild(h2);

        var meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = host || "Glenn Beck";
        root.appendChild(meta);

        var shell = document.createElement("div");
        shell.className = "yt-shell";
        shell.setAttribute("data-yid", yid);
        shell.setAttribute("data-title", title || yid);
        shell.innerHTML = facadeHtml(yid, title);
        root.appendChild(shell);

        var actions = document.createElement("div");
        actions.className = "actions";

        var openYt = document.createElement("a");
        openYt.className = "btn-yt";
        openYt.href = watchUrl(yid);
        openYt.target = "_blank";
        openYt.rel = "noopener noreferrer";
        openYt.textContent = "Open on YouTube →";
        actions.appendChild(openYt);

        var playHere = document.createElement("button");
        playHere.type = "button";
        playHere.className = "btn-inline";
        playHere.textContent = "Play here";
        playHere.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          mountInline(shell, yid, true);
        });
        actions.appendChild(playHere);

        if (item.url) {
          var blaze = document.createElement("a");
          blaze.className = "btn-blaze";
          blaze.href = String(item.url);
          blaze.target = "_blank";
          blaze.rel = "noopener noreferrer";
          blaze.textContent = "Open source →";
          actions.appendChild(blaze);
        }

        root.appendChild(actions);
        return root;
      }

      function xCard(item, i) {
        var id = String(item.x_id || i);
        var title = item.title || "Clip";
        var host = item.host || item.x_username || "X";
        var mp4 = item.x_video_url || item.mp4 || "";
        var poster = item.x_video_poster || item.image || "";
        var root = document.createElement("article");
        root.className = "card";
        root.id = "v-" + id;

        var badge = item.x_pinned ? "PINNED" : "X VIDEO";
        var h2 = document.createElement("h2");
        h2.innerHTML = '<span class="badge">' + badge + "</span>" + esc(title);
        root.appendChild(h2);

        var meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = host;
        root.appendChild(meta);

        if (mp4) {
          var v = document.createElement("video");
          v.controls = true;
          v.playsInline = true;
          v.preload = "metadata";
          v.setAttribute("referrerpolicy", "no-referrer");
          if (poster) v.poster = poster;
          v.src = mp4;
          v.addEventListener("play", function () {
            // Exclusive: stop other X clips + any in-page YouTube
            pauseHtml5(v);
            demountAllYouTube(null);
            activeVideo = v;
          });
          root.appendChild(v);
          observeForScrollPause(v);
        } else if (item.x_id) {
          var user = String(item.x_username || "i").replace(/[^A-Za-z0-9_]/g, "");
          var bq = document.createElement("blockquote");
          bq.className = "twitter-tweet";
          bq.setAttribute("data-media-max-width", "560");
          var a = document.createElement("a");
          a.href = "https://twitter.com/" + user + "/status/" + id;
          bq.appendChild(a);
          root.appendChild(bq);
        } else if (item.url) {
          var p = document.createElement("p");
          var la = document.createElement("a");
          la.href = item.url;
          la.target = "_blank";
          la.rel = "noopener";
          la.style.color = "#38bdf8";
          la.textContent = "Open on X →";
          p.appendChild(la);
          root.appendChild(p);
        }
        return root;
      }

      function card(item, i) {
        var title = item.title || "Clip";
        var host = item.host || item.x_username || "Host";
        var yid = ytId(item);
        if (yid && (item.kind === "video" || !item.x_id)) {
          return youtubeCard(item, yid, title, host);
        }
        if (item.x_id || item.x_video_url || item.kind === "x") {
          return xCard(item, i);
        }
        if (yid) {
          return youtubeCard(item, yid, title, host);
        }
        var root = document.createElement("article");
        root.className = "card";
        var h2 = document.createElement("h2");
        h2.textContent = title;
        root.appendChild(h2);
        if (item.url) {
          var a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.style.color = "#38bdf8";
          a.textContent = "Open source →";
          root.appendChild(a);
        }
        return root;
      }

      function applyFocus(yid) {
        if (!yid) return;
        var el = document.getElementById("v-" + yid);
        if (!el) {
          el = rail.querySelector('[data-youtube-id="' + yid + '"]');
        }
        if (!el) return;
        el.classList.add("focus");
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        var shell = el.querySelector(".yt-shell");
        if (shell) {
          mountInline(shell, yid, true);
        }
      }

      ensureScrollIo();
      // Warm the YouTube IFrame API so Play here is instant
      loadYouTubeApi(function () {});

      fetch("/td-videos.json?_=" + Date.now())
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          var items = (data && data.items) || [];
          if (!items.length) {
            status.textContent = "No clips in the latest export yet.";
            return;
          }
          status.remove();
          rail.innerHTML = "";
          items.forEach(function (it, i) {
            rail.appendChild(card(it, i));
          });
          // Re-observe any videos that were added
          rail.querySelectorAll("video").forEach(observeForScrollPause);
          if (focus) {
            applyFocus(cleanId(focus));
          }
          if (rail.querySelector(".twitter-tweet")) {
            var s = document.createElement("script");
            s.src = "https://platform.twitter.com/widgets.js";
            s.async = true;
            document.body.appendChild(s);
          }
        })
        .catch(function (e) {
          status.textContent = "Could not load clips: " + e.message;
        });
    })();
  </script>
</body>
</html>
