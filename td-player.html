<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Truth Desk · Video player</title>
  <meta name="robots" content="noindex" />
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
    }
    header a { color: #38bdf8; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card {
      margin: 0 0 18px;
      padding: 12px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      line-height: 1.35;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fecaca;
      color: #7f1d1d;
      margin-right: 8px;
    }
    video {
      width: 100%;
      max-height: 420px;
      border-radius: 10px;
      background: #000;
      display: block;
    }
    .yt-facade {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
      border: 0;
      padding: 0;
      display: block;
      color: inherit;
      text-align: left;
    }
    .yt-facade img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .yt-facade .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(transparent 40%, rgba(0,0,0,0.55));
    }
    .yt-facade .play span {
      width: 68px;
      height: 48px;
      border-radius: 14px;
      background: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .yt-facade .play span::before {
      content: "";
      display: block;
      margin-left: 4px;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff;
    }
    .yt-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .yt-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .meta { font-size: 0.85rem; color: #94a3b8; margin: 0 0 10px; }
    .meta a { color: #38bdf8; }
    .err {
      margin: 8px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #7f1d1d;
      color: #fecaca;
      font-size: 0.85rem;
    }
  </style>
  <!-- Intentionally no td-media.js here: it was resetting YouTube iframes. -->
</head>
<body>
  <header>
    <strong>Truth Desk · smart video player</strong>
    · <a href="https://wethepeople.news.blog/category/truth-desk/">Back to desk</a>
    <p style="margin:6px 0 0;font-size:0.85rem;color:#94a3b8;">
      Click a YouTube thumbnail to play. X clips use native video when available.
    </p>
  </header>
  <main id="rail">
    <p id="status">Loading clips…</p>
  </main>
  <script>
    (function () {
      var status = document.getElementById("status");
      var rail = document.getElementById("rail");
      var focus = new URLSearchParams(location.search).get("v") || location.hash.replace(/^#/, "");
      var activeVideo = null;

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function ytId(item) {
        if (item.youtube_id) return String(item.youtube_id).trim();
        var u = String(item.youtube || item.url || "");
        var m =
          u.match(/[?&]v=([A-Za-z0-9_-]{6,})/) ||
          u.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/) ||
          u.match(/embed\/([A-Za-z0-9_-]{6,})/) ||
          u.match(/shorts\/([A-Za-z0-9_-]{6,})/);
        return m ? m[1] : "";
      }

      function pauseOtherMedia(exceptVideo) {
        rail.querySelectorAll("video").forEach(function (v) {
          if (v !== exceptVideo) {
            try { v.pause(); } catch (e) {}
          }
        });
        // Remove other YouTube iframes back to facades would be heavy; pause by
        // replacing src with empty is disruptive — leave other YT players alone.
      }

      function mountYouTube(wrap, yid) {
        if (!wrap || wrap.getAttribute("data-mounted") === "1") return;
        wrap.setAttribute("data-mounted", "1");
        wrap.innerHTML = "";
        var box = document.createElement("div");
        box.className = "yt-frame-wrap";
        var iframe = document.createElement("iframe");
        iframe.setAttribute("title", "YouTube video");
        iframe.setAttribute("allowfullscreen", "");
        iframe.setAttribute(
          "allow",
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        );
        // Minimal embed URL — no origin/enablejsapi (those have broken some embeds).
        // autoplay=1 after user click is allowed by browsers.
        iframe.src =
          "https://www.youtube.com/embed/" +
          encodeURIComponent(yid) +
          "?autoplay=1&rel=0&modestbranding=1&playsinline=1";
        box.appendChild(iframe);
        wrap.appendChild(box);
        pauseOtherMedia(null);
      }

      function youtubeCard(item, yid, title, host) {
        var poster =
          item.image ||
          item.x_video_poster ||
          "https://i.ytimg.com/vi/" + encodeURIComponent(yid) + "/hqdefault.jpg";
        var root = document.createElement("article");
        root.className = "card";
        root.id = "v-" + yid;

        var h2 = document.createElement("h2");
        h2.innerHTML = '<span class="badge">YOUTUBE</span>' + esc(title);
        root.appendChild(h2);

        var meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = host;
        root.appendChild(meta);

        var facadeWrap = document.createElement("div");
        facadeWrap.className = "yt-host";

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "yt-facade";
        btn.setAttribute("aria-label", "Play " + title);
        btn.innerHTML =
          '<img src="' +
          esc(poster) +
          '" alt="" loading="lazy" referrerpolicy="no-referrer" />' +
          '<div class="play"><span></span></div>';
        btn.addEventListener("click", function () {
          mountYouTube(facadeWrap, yid);
        });
        facadeWrap.appendChild(btn);
        root.appendChild(facadeWrap);

        var links = document.createElement("p");
        links.className = "meta";
        links.style.marginTop = "8px";
        var ytA = document.createElement("a");
        ytA.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(yid);
        ytA.target = "_blank";
        ytA.rel = "noopener";
        ytA.textContent = "Open on YouTube →";
        links.appendChild(ytA);
        if (item.url) {
          links.appendChild(document.createTextNode(" · "));
          var bA = document.createElement("a");
          bA.href = String(item.url);
          bA.target = "_blank";
          bA.rel = "noopener";
          bA.textContent = "Open on The Blaze →";
          links.appendChild(bA);
        }
        root.appendChild(links);
        return root;
      }

      function xCard(item, i) {
        var id = String(item.x_id || i);
        var title = item.title || "Clip";
        var host = item.host || item.x_username || "X";
        var mp4 = item.x_video_url || item.mp4 || "";
        var poster = item.x_video_poster || item.image || "";
        var root = document.createElement("article");
        root.className = "card";
        root.id = "v-" + id;

        var badge = item.x_pinned ? "PINNED" : "X VIDEO";
        var h2 = document.createElement("h2");
        h2.innerHTML = '<span class="badge">' + badge + "</span>" + esc(title);
        root.appendChild(h2);

        var meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = host;
        root.appendChild(meta);

        if (mp4) {
          var v = document.createElement("video");
          v.className = "td-media-player";
          v.controls = true;
          v.playsInline = true;
          v.preload = "metadata";
          v.setAttribute("referrerpolicy", "no-referrer");
          if (poster) v.poster = poster;
          v.src = mp4;
          v.addEventListener("play", function () {
            if (activeVideo && activeVideo !== v) {
              try { activeVideo.pause(); } catch (e) {}
            }
            activeVideo = v;
          });
          root.appendChild(v);
        } else if (item.x_id) {
          var user = String(item.x_username || "i").replace(/[^A-Za-z0-9_]/g, "");
          var bq = document.createElement("blockquote");
          bq.className = "twitter-tweet";
          bq.setAttribute("data-media-max-width", "560");
          var a = document.createElement("a");
          a.href = "https://twitter.com/" + user + "/status/" + id;
          bq.appendChild(a);
          root.appendChild(bq);
        } else if (item.url) {
          var p = document.createElement("p");
          var la = document.createElement("a");
          la.href = item.url;
          la.target = "_blank";
          la.rel = "noopener";
          la.style.color = "#38bdf8";
          la.textContent = "Open on X →";
          p.appendChild(la);
          root.appendChild(p);
        }
        return root;
      }

      function card(item, i) {
        var title = item.title || "Clip";
        var host = item.host || item.x_username || "Host";
        var yid = ytId(item);
        // Prefer YouTube when present (Glenn Blaze segments)
        if (yid && (item.kind === "video" || !item.x_id)) {
          return youtubeCard(item, yid, title, host);
        }
        if (item.x_id || item.x_video_url || item.kind === "x") {
          return xCard(item, i);
        }
        if (yid) {
          return youtubeCard(item, yid, title, host);
        }
        var root = document.createElement("article");
        root.className = "card";
        root.innerHTML =
          "<h2>" +
          esc(title) +
          '</h2><p class="meta">' +
          esc(host) +
          "</p>";
        if (item.url) {
          var p = document.createElement("p");
          var a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.style.color = "#38bdf8";
          a.textContent = "Open source →";
          p.appendChild(a);
          root.appendChild(p);
        }
        return root;
      }

      fetch("/td-videos.json?_=" + Date.now())
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          var items = (data && data.items) || [];
          if (!items.length) {
            status.textContent = "No clips in the latest export yet.";
            return;
          }
          status.remove();
          rail.innerHTML = "";
          items.forEach(function (it, i) {
            rail.appendChild(card(it, i));
          });
          if (focus) {
            var el = document.getElementById("v-" + focus);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
          // Twitter widgets only if needed
          if (rail.querySelector(".twitter-tweet")) {
            var s = document.createElement("script");
            s.src = "https://platform.twitter.com/widgets.js";
            s.async = true;
            document.body.appendChild(s);
          }
        })
        .catch(function (e) {
          status.textContent = "Could not load clips: " + e.message;
        });
    })();
  </script>
</body>
</html>
