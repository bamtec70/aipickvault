<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Truth Desk · Video player</title>
  <meta name="robots" content="noindex" />
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
    }
    header a { color: #38bdf8; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card {
      margin: 0 0 18px;
      padding: 12px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .card.focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 1px #f59e0b;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      line-height: 1.35;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fecaca;
      color: #7f1d1d;
      margin-right: 8px;
    }
    video {
      width: 100%;
      max-height: 420px;
      border-radius: 10px;
      background: #000;
      display: block;
    }
    .yt-shell {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .yt-facade {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      border: 0;
      padding: 0;
      background: #000;
    }
    .yt-facade img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .yt-facade .shade {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(transparent 30%, rgba(0, 0, 0, 0.65));
    }
    .yt-facade .btn-play {
      width: 72px;
      height: 50px;
      border-radius: 14px;
      background: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .yt-facade .btn-play::before {
      content: "";
      display: block;
      margin-left: 4px;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff;
    }
    .yt-facade .label {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    .yt-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .yt-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .actions a,
    .actions button {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 999px;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-yt {
      background: #dc2626;
      color: #fff !important;
    }
    .btn-inline {
      background: #334155;
      color: #e2e8f0 !important;
    }
    .btn-blaze {
      background: #1e293b;
      color: #38bdf8 !important;
      border: 1px solid #334155;
    }
    .meta {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0 0 10px;
    }
  </style>
</head>
<body>
  <header>
    <strong>Truth Desk · smart video player</strong>
    · <a href="https://wethepeoplepress.com/category/truth-desk/">Back to desk</a>
    <p style="margin:6px 0 0;font-size:0.85rem;color:#94a3b8;">
      Only one clip plays at a time. Scroll away to auto-pause. Red play opens YouTube (always works).
    </p>
  </header>
  <main id="rail">
    <p id="status">Loading clips…</p>
  </main>
  <script>
    (function () {
      var status = document.getElementById("status");
      var rail = document.getElementById("rail");
      var focus = (
        new URLSearchParams(location.search).get("v") ||
        location.hash.replace(/^#/, "") ||
        ""
      ).trim();
      var activeVideo = null;
      var scrollIo = null;

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function cleanId(id) {
        return String(id || "").replace(/[^A-Za-z0-9_-]/g, "");
      }

      function ytId(item) {
        var direct = cleanId(item.youtube_id);
        if (direct) return direct;
        var u = String(item.youtube || item.url || "");
        var m =
          u.match(/[?&]v=([A-Za-z0-9_-]{6,})/) ||
          u.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/) ||
          u.match(/embed\/([A-Za-z0-9_-]{6,})/) ||
          u.match(/shorts\/([A-Za-z0-9_-]{6,})/);
        return m ? cleanId(m[1]) : "";
      }

      function watchUrl(yid) {
        return "https://www.youtube.com/watch?v=" + encodeURIComponent(yid);
      }

      function embedUrl(yid, autoplay) {
        // origin helps some browsers accept the embed + autoplay after a click
        var origin = "";
        try {
          origin = "&origin=" + encodeURIComponent(location.origin);
        } catch (e) {}
        return (
          "https://www.youtube.com/embed/" +
          encodeURIComponent(yid) +
          "?rel=0&modestbranding=1&playsinline=1&enablejsapi=1" +
          origin +
          (autoplay ? "&autoplay=1" : "")
        );
      }

      function posterUrl(item, yid) {
        return "https://i.ytimg.com/vi/" + encodeURIComponent(yid) + "/hqdefault.jpg";
      }

      function pauseHtml5(except) {
        rail.querySelectorAll("video").forEach(function (v) {
          if (except && v === except) return;
          try {
            if (!v.paused) v.pause();
          } catch (e) {}
        });
        activeVideo = except || null;
      }

      function facadeHtml(yid, title) {
        return (
          '<a class="yt-facade" href="' +
          esc(watchUrl(yid)) +
          '" target="_blank" rel="noopener noreferrer" aria-label="Watch on YouTube: ' +
          esc(title || yid) +
          '">' +
          '<img src="' +
          esc(posterUrl(null, yid)) +
          '" alt="" width="640" height="360" loading="lazy" />' +
          '<div class="shade"><span class="btn-play" aria-hidden="true"></span>' +
          '<span class="label">Watch on YouTube</span></div></a>'
        );
      }

      /** Tear down an inline YouTube iframe back to the poster facade (stops audio). */
      function demountShell(shell) {
        if (!shell || !shell.classList.contains("yt-shell")) return;
        if (!shell.querySelector("iframe")) return;
        // Don't tear down a player we just mounted (IO often fires with ratio 0
        // while layout is still settling after innerHTML clear).
        var protectUntil = parseInt(shell.getAttribute("data-protect-until") || "0", 10);
        if (protectUntil && Date.now() < protectUntil) return;
        var yid = shell.getAttribute("data-yid") || "";
        var title = shell.getAttribute("data-title") || yid;
        shell.removeAttribute("data-playing");
        shell.innerHTML = facadeHtml(yid, title);
      }

      function demountAllYouTube(exceptShell) {
        rail.querySelectorAll(".yt-shell").forEach(function (shell) {
          if (exceptShell && shell === exceptShell) return;
          // Force demount others even if protect window set
          shell.removeAttribute("data-protect-until");
          demountShell(shell);
        });
      }

      function observeForScrollPause(el) {
        if (!el || !scrollIo) return;
        try {
          scrollIo.observe(el);
        } catch (e) {}
      }

      function ensureScrollIo() {
        if (scrollIo || !("IntersectionObserver" in window)) return;
        scrollIo = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (en) {
              var el = en.target;
              // Only act after the element has been substantially on-screen once.
              // Initial IO callbacks often report ratio 0 right after mount.
              if (en.intersectionRatio >= 0.25) {
                el.setAttribute("data-was-visible", "1");
                return;
              }
              if (el.getAttribute("data-was-visible") !== "1") return;
              if (el.tagName === "VIDEO") {
                try {
                  if (!el.paused) el.pause();
                } catch (e) {}
                if (activeVideo === el) activeVideo = null;
                return;
              }
              // YouTube shell scrolled mostly off-screen → stop by demounting
              if (el.classList && el.classList.contains("yt-shell")) {
                demountShell(el);
              }
            });
          },
          { threshold: [0, 0.1, 0.25, 0.5, 1], rootMargin: "0px" }
        );
      }

      function mountInline(shell, yid, autoplay) {
        if (!shell || !yid) {
          console.warn("Play here: missing shell or video id", shell, yid);
          return;
        }
        yid = cleanId(yid);
        if (!yid) return;

        // Exclusive: stop other HTML5 + other YouTube embeds first
        pauseHtml5(null);
        demountAllYouTube(shell);

        // Protect from immediate IO demount while iframe lays out
        shell.setAttribute("data-protect-until", String(Date.now() + 2500));
        shell.setAttribute("data-playing", "1");
        shell.setAttribute("data-was-visible", "1");

        var title = shell.getAttribute("data-title") || yid;
        shell.innerHTML = "";

        // Keep shell height while mounting so IO doesn't see a 0-height box
        shell.style.minHeight = "220px";

        var frame = document.createElement("div");
        frame.className = "yt-frame";
        var iframe = document.createElement("iframe");
        iframe.title = "YouTube video player";
        iframe.setAttribute(
          "allow",
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        );
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.setAttribute("allowfullscreen", "true");
        iframe.setAttribute("frameborder", "0");
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        // Set src last so allow= is in place before load
        iframe.src = embedUrl(yid, !!autoplay);
        frame.appendChild(iframe);
        shell.appendChild(frame);

        var note = document.createElement("p");
        note.className = "meta";
        note.style.margin = "8px 0 0";
        note.innerHTML =
          'Playing here · scroll away to stop · or <a class="btn-yt" style="padding:4px 10px" href="' +
          esc(watchUrl(yid)) +
          '" target="_blank" rel="noopener">Open on YouTube</a>';
        shell.appendChild(note);

        // Observe after layout so first callback sees a real height
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            observeForScrollPause(shell);
            shell.style.minHeight = "";
          });
        });
      }

      function youtubeCard(item, yid, title, host) {
        var root = document.createElement("article");
        root.className = "card";
        root.id = "v-" + yid;
        root.setAttribute("data-youtube-id", yid);

        var h2 = document.createElement("h2");
        h2.innerHTML = '<span class="badge">YOUTUBE</span>' + esc(title);
        root.appendChild(h2);

        var meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = host || "Glenn Beck";
        root.appendChild(meta);

        var shell = document.createElement("div");
        shell.className = "yt-shell";
        shell.setAttribute("data-yid", yid);
        shell.setAttribute("data-title", title || yid);
        shell.innerHTML = facadeHtml(yid, title);
        root.appendChild(shell);

        var actions = document.createElement("div");
        actions.className = "actions";

        var openYt = document.createElement("a");
        openYt.className = "btn-yt";
        openYt.href = watchUrl(yid);
        openYt.target = "_blank";
        openYt.rel = "noopener noreferrer";
        openYt.textContent = "Open on YouTube →";
        actions.appendChild(openYt);

        var playHere = document.createElement("button");
        playHere.type = "button";
        playHere.className = "btn-inline";
        playHere.textContent = "Play here";
        playHere.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          try {
            mountInline(shell, yid, true);
          } catch (err) {
            console.error("Play here failed", err);
            // Last resort: open YouTube so the user is never stuck
            window.open(watchUrl(yid), "_blank", "noopener,noreferrer");
          }
        });
        actions.appendChild(playHere);

        if (item.url) {
          var blaze = document.createElement("a");
          blaze.className = "btn-blaze";
          blaze.href = String(item.url);
          blaze.target = "_blank";
          blaze.rel = "noopener noreferrer";
          blaze.textContent = "Open source →";
          actions.appendChild(blaze);
        }

        root.appendChild(actions);
        return root;
      }

      function xCard(item, i) {
        var id = String(item.x_id || i);
        var title = item.title || "Clip";
        var host = item.host || item.x_username || "X";
        var mp4 = item.x_video_url || item.mp4 || "";
        var poster = item.x_video_poster || item.image || "";
        var root = document.createElement("article");
        root.className = "card";
        root.id = "v-" + id;

        var badge = item.x_pinned ? "PINNED" : "X VIDEO";
        var h2 = document.createElement("h2");
        h2.innerHTML = '<span class="badge">' + badge + "</span>" + esc(title);
        root.appendChild(h2);

        var meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = host;
        root.appendChild(meta);

        if (mp4) {
          var v = document.createElement("video");
          v.controls = true;
          v.playsInline = true;
          v.preload = "metadata";
          v.setAttribute("referrerpolicy", "no-referrer");
          if (poster) v.poster = poster;
          v.src = mp4;
          v.addEventListener("play", function () {
            // Exclusive: stop other X clips + any in-page YouTube
            pauseHtml5(v);
            demountAllYouTube(null);
            activeVideo = v;
          });
          root.appendChild(v);
          observeForScrollPause(v);
        } else if (item.x_id) {
          var user = String(item.x_username || "i").replace(/[^A-Za-z0-9_]/g, "");
          var bq = document.createElement("blockquote");
          bq.className = "twitter-tweet";
          bq.setAttribute("data-media-max-width", "560");
          var a = document.createElement("a");
          a.href = "https://twitter.com/" + user + "/status/" + id;
          bq.appendChild(a);
          root.appendChild(bq);
        } else if (item.url) {
          var p = document.createElement("p");
          var la = document.createElement("a");
          la.href = item.url;
          la.target = "_blank";
          la.rel = "noopener";
          la.style.color = "#38bdf8";
          la.textContent = "Open on X →";
          p.appendChild(la);
          root.appendChild(p);
        }
        return root;
      }

      function card(item, i) {
        var title = item.title || "Clip";
        var host = item.host || item.x_username || "Host";
        var yid = ytId(item);
        if (yid && (item.kind === "video" || !item.x_id)) {
          return youtubeCard(item, yid, title, host);
        }
        if (item.x_id || item.x_video_url || item.kind === "x") {
          return xCard(item, i);
        }
        if (yid) {
          return youtubeCard(item, yid, title, host);
        }
        var root = document.createElement("article");
        root.className = "card";
        var h2 = document.createElement("h2");
        h2.textContent = title;
        root.appendChild(h2);
        if (item.url) {
          var a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.style.color = "#38bdf8";
          a.textContent = "Open source →";
          root.appendChild(a);
        }
        return root;
      }

      function applyFocus(yid) {
        if (!yid) return;
        var el = document.getElementById("v-" + yid);
        if (!el) {
          el = rail.querySelector('[data-youtube-id="' + yid + '"]');
        }
        if (!el) return;
        el.classList.add("focus");
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        var shell = el.querySelector(".yt-shell");
        if (shell) {
          mountInline(shell, yid, true);
        }
      }

      ensureScrollIo();

      fetch("/td-videos.json?_=" + Date.now())
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          var items = (data && data.items) || [];
          if (!items.length) {
            status.textContent = "No clips in the latest export yet.";
            return;
          }
          status.remove();
          rail.innerHTML = "";
          items.forEach(function (it, i) {
            rail.appendChild(card(it, i));
          });
          // Re-observe any videos that were added
          rail.querySelectorAll("video").forEach(observeForScrollPause);
          if (focus) {
            applyFocus(cleanId(focus));
          }
          if (rail.querySelector(".twitter-tweet")) {
            var s = document.createElement("script");
            s.src = "https://platform.twitter.com/widgets.js";
            s.async = true;
            document.body.appendChild(s);
          }
        })
        .catch(function (e) {
          status.textContent = "Could not load clips: " + e.message;
        });
    })();
  </script>
</body>
</html>
