# Standalone Layer-2 post-scan accuracy audit (no refresh).
# Use after a manual fix or to re-check the live snapshot without re-scanning eBay.
name: Price scan audit

on:
  workflow_dispatch: {}
  # Optional mid-day safety net (~2 PM CT / 19:00 UTC)
  schedule:
    - cron: "0 19 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run post-scan audit
        env:
          PRICE_API_URL: ${{ vars.PRICE_API_URL }}
        run: |
          set -euo pipefail
          BASE="${PRICE_API_URL:-https://ebay-api.aipickvault.com}"
          BASE="${BASE%/}"
          mkdir -p ebay-worker/_audit
          curl -fsS "$BASE/v1/snapshot" -o ebay-worker/_audit/snapshot.json
          curl -fsS "$BASE/health" -o ebay-worker/_audit/health.json
          python3 ebay-worker/audit_snapshot.py \
            --base-url "$BASE" \
            --snapshot ebay-worker/_audit/snapshot.json \
            --catalog ebay-worker/src/catalog.json \
            --report ebay-worker/_audit/report.json \
            --fail-on error

      - name: Write cart-check email (human instructions)
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CART_CHECK_EMAIL_TO: ${{ secrets.CART_CHECK_EMAIL_TO }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          set -euo pipefail
          if [ ! -f ebay-worker/_audit/report.json ]; then
            echo "No audit report — skip cart-check email"
            exit 0
          fi
          python3 ebay-worker/notify_cart_check_email.py \
            --report ebay-worker/_audit/report.json \
            --out ebay-worker/_audit/cart_check_email.txt \
            --run-url "$RUN_URL"
          # Send when RESEND_API_KEY is configured (CART_CHECK_EMAIL_TO optional)
          python3 ebay-worker/notify_cart_check_email.py \
            --report ebay-worker/_audit/report.json \
            --out ebay-worker/_audit/cart_check_email.txt \
            --run-url "$RUN_URL" \
            --send || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: price-scan-audit
          path: ebay-worker/_audit/

      - name: Phone alert on failure (ntfy)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_TITLE: "AI Pick Vault: price audit failed — cart check may be required"
        run: |
          chmod +x .github/scripts/notify-ntfy-on-failure.sh
          .github/scripts/notify-ntfy-on-failure.sh
