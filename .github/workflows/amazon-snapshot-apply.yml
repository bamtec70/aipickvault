# Apply Amazon material price drifts to index.html and push to main.
# Separate from Amazon snapshot watch (detect-only). This job WRITES the live site
# via git push → GitHub Pages.
#
# Runs fully on GitHub (ubuntu runners). Your PC does NOT need to be on.
#
# Triggers:
#   1) Automatically after "Amazon snapshot watch" finishes (any conclusion)
#      → uses that run's artifact report (no re-scrape required)
#   2) Manual "Run workflow" (live re-fetch or latest artifact)
name: Amazon snapshot apply

on:
  workflow_run:
    workflows: ["Amazon snapshot watch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: "Where to get prices"
        type: choice
        required: true
        default: live-fetch
        options:
          - live-fetch
          - latest-watch-artifact
      dry_run:
        description: "Preview only (do not commit/push)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Auto path: only after the watch workflow finished (success or failure).
    # Material drift fails the watch on purpose (exit 1) — we still want to apply.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_run jobs default to the default branch; pin main explicitly
          ref: main

      - name: Decide source mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "source=triggering-watch-artifact" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "watch_run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "Auto: apply from watch run ${{ github.event.workflow_run.id }}"
          else
            echo "source=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "watch_run_id=" >> "$GITHUB_OUTPUT"
            echo "Manual: source=${{ inputs.source }} dry_run=${{ inputs.dry_run }}"
          fi

      - name: Live-fetch and apply material Amazon prices
        if: ${{ steps.mode.outputs.source == 'live-fetch' }}
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p ebay-worker/_audit
          DRY_FLAG=()
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_FLAG=(--dry-run)
          fi
          set +e
          python3 ebay-worker/amazon_snapshot_watch.py \
            --index index.html \
            --report ebay-worker/_audit/amazon_watch_report.json \
            --checklist ebay-worker/_audit/amazon_watch_checklist.md \
            --sleep 1.2 \
            --fail-on-fetch-rate 0.35 \
            --soft-fetch-fail \
            --apply \
            "${DRY_FLAG[@]}"
          code=$?
          set -e
          if [ -f ebay-worker/_audit/amazon_watch_report.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("ebay-worker/_audit/amazon_watch_report.json").read_text(encoding="utf-8"))
          print(
              "materialCount", d.get("materialCount"),
              "ok", d.get("okCount"), "/", d.get("count"),
              "rate", d.get("fetchRate"),
          )
          for m in d.get("material") or []:
              live = m.get("live") if m.get("live") is not None else m.get("camel")
              print(f"MATERIAL {m.get('asin')} ${m.get('site')} -> ${live} ({m.get('delta'):+})")
          PY
          fi
          exit "$code"

      - name: Download Amazon snapshot watch artifact
        id: download_artifact
        if: |
          steps.mode.outputs.source == 'latest-watch-artifact' ||
          steps.mode.outputs.source == 'triggering-watch-artifact'
        uses: actions/github-script@v7
        env:
          WATCH_RUN_ID: ${{ steps.mode.outputs.watch_run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function artifactFromRun(runId) {
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: runId, per_page: 30
              });
              return (arts.data.artifacts || []).find(a =>
                a.name === 'amazon-snapshot-watch' && !a.expired
              ) || null;
            }

            let runId = process.env.WATCH_RUN_ID ? Number(process.env.WATCH_RUN_ID) : null;
            let artifact = null;
            let chosenUrl = '';

            if (runId) {
              artifact = await artifactFromRun(runId);
              if (artifact) {
                chosenUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
              }
            }

            if (!artifact) {
              // Fallback: newest watch run that still has the artifact
              const workflows = await github.paginate(
                github.rest.actions.listRepoWorkflows,
                { owner, repo, per_page: 100 }
              );
              const wf = workflows.find(w =>
                (w.path || '').endsWith('amazon-snapshot-watch.yml') ||
                w.name === 'Amazon snapshot watch'
              );
              if (!wf) {
                core.setFailed('Amazon snapshot watch workflow not found');
                return;
              }
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: wf.id, per_page: 20
              });
              for (const run of runs.data.workflow_runs || []) {
                const hit = await artifactFromRun(run.id);
                if (hit) {
                  runId = run.id;
                  artifact = hit;
                  chosenUrl = run.html_url;
                  break;
                }
              }
            }

            if (!artifact) {
              core.setFailed('No amazon-snapshot-watch artifact found');
              return;
            }

            core.info(`Using artifact ${artifact.id} from run ${runId} (${chosenUrl})`);
            const zip = await github.rest.actions.downloadArtifact({
              owner, repo, artifact_id: artifact.id, archive_format: 'zip'
            });
            const outDir = 'ebay-worker/_audit';
            fs.mkdirSync(outDir, { recursive: true });
            const zipPath = path.join(outDir, 'amazon-snapshot-watch.zip');
            fs.writeFileSync(zipPath, Buffer.from(zip.data));
            execSync(`unzip -o "${zipPath}" -d "${outDir}"`, { stdio: 'inherit' });
            const report = path.join(outDir, 'amazon_watch_report.json');
            if (!fs.existsSync(report)) {
              core.setFailed(`Report missing after unzip: ${report}`);
              return;
            }
            const data = JSON.parse(fs.readFileSync(report, 'utf8'));
            const material = Number(data.materialCount || 0);
            const rate = Number(data.fetchRate || 0);
            core.info(`Report materialCount=${material} fetchRate=${rate}`);
            if (material < 1) {
              core.info('No material Amazon drift in report — nothing to apply');
              core.setOutput('skip_apply', 'true');
              return;
            }
            if (rate < 0.35) {
              core.warning(`Fetch rate ${rate} below 35% — skip apply to avoid bad prices`);
              core.setOutput('skip_apply', 'true');
              return;
            }
            core.setOutput('skip_apply', 'false');
            core.info(`Report ready: ${report}`);

      - name: Apply from watch artifact report
        if: |
          (steps.mode.outputs.source == 'latest-watch-artifact' ||
           steps.mode.outputs.source == 'triggering-watch-artifact') &&
          steps.download_artifact.outputs.skip_apply != 'true'
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          REPORT="ebay-worker/_audit/amazon_watch_report.json"
          test -f "$REPORT"
          DRY_FLAG=()
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_FLAG=(--dry-run)
          fi
          python3 ebay-worker/amazon_snapshot_watch.py \
            --index index.html \
            --from-report "$REPORT" \
            --apply \
            "${DRY_FLAG[@]}"

      - name: Upload apply audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amazon-snapshot-apply
          path: ebay-worker/_audit/
          if-no-files-found: ignore

      - name: Commit and push index.html (live site)
        if: ${{ steps.mode.outputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ensure we are on latest main before push (watch may have raced)
          git pull --rebase origin main || true
          git add index.html
          if git diff --staged --quiet; then
            echo "No index.html changes — live site already current for this apply"
          else
            git commit -m "chore: apply Amazon snapshot prices to index.html"
            git push
            echo "Pushed index.html — GitHub Pages will rebuild the live site"
          fi
