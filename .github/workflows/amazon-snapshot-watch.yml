# Pre-PA-API Amazon snapshot watch (detect Amazon price drift vs index.html).
# Flags material drift ( >= $2 or >= 5% ).
#
# Scheduled pipeline: runs AFTER "Daily price refresh" completes so eBay
# finishes first, then Amazon. Manual "Run workflow" still works anytime.
# Then "Amazon snapshot apply" may push index.html → Pages updates the site.
name: Amazon snapshot watch

on:
  workflow_run:
    workflows: ["Daily price refresh"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: aipickvault-price-pipeline
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Run after daily eBay job finishes (success or failure — Amazon still useful).
    # Manual dispatch always runs.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Amazon snapshot watch
        id: watch
        run: |
          set -euo pipefail
          mkdir -p ebay-worker/_audit
          set +e
          python3 ebay-worker/amazon_snapshot_watch.py \
            --index index.html \
            --report ebay-worker/_audit/amazon_watch_report.json \
            --checklist ebay-worker/_audit/amazon_watch_checklist.md \
            --sleep 1.2 \
            --fail-on-material \
            --fail-on-fetch-rate 0.35 \
            --soft-fetch-fail
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f ebay-worker/_audit/amazon_watch_report.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("ebay-worker/_audit/amazon_watch_report.json").read_text(encoding="utf-8"))
          print("materialCount", d.get("materialCount"), "ok", d.get("okCount"), "/", d.get("count"), "rate", d.get("fetchRate"))
          for m in d.get("material") or []:
              live = m.get("live") if m.get("live") is not None else m.get("camel")
              print(f"MATERIAL {m.get('asin')} ${m.get('site')} -> ${live} ({m.get('delta'):+})")
          PY
          fi
          # 1 = material drift (ntfy); 0 = clean or soft-blocked fetch
          exit "$code"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amazon-snapshot-watch
          path: ebay-worker/_audit/
          if-no-files-found: ignore

      - name: Phone alert on material Amazon drift / watch failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_TITLE: "AI Pick Vault: Amazon snapshot drift"
        run: |
          chmod +x .github/scripts/notify-ntfy-on-failure.sh
          # Prefer shared notifier when report is in _audit/
          if [ -f ebay-worker/_audit/amazon_watch_report.json ] && [ ! -f ebay-worker/_audit/report.json ]; then
            cp ebay-worker/_audit/amazon_watch_report.json ebay-worker/_audit/report.json || true
          fi
          .github/scripts/notify-ntfy-on-failure.sh
